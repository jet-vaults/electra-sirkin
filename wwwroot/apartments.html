  <style>
    /* Local tweaks just for the apartments page */
    .apartments-page { padding-block: clamp(2rem, 6vw, 5rem); }
    .apartments-page__head { text-align: center; margin-bottom: clamp(1.5rem, 4vw, 2.8rem); }
    .apartments-page__title {

      color: var(--ink);
    }
    .apartments-page__sub {
      margin-top: .8rem;
      color: var(--muted);
      font-size: clamp(.96rem, 1.2vw, 1.05rem);
    }
    .apartments-page__back {
      display: inline-flex; align-items: center; gap: .4rem;
      margin-top: 1.2rem;
      color: var(--accent);
      font-weight: 500;
      font-size: .95rem;
    }
    .apartments-page__back:hover { color: var(--accent-deep); }
    .jv-realestate-mount { min-height: 240px; }

    /* Widget display buttons */
    .jv-realestate-root .display-btn {
      width: 130px;
      padding: 10px;
      background-color: var(--light-color) !important;
      color: #fdfcfb !important;
      border-color: var(--main-color) !important;
    }
    .jv-realestate-root .display-btn.active {
      width: 130px;
      padding: 10px;
      background-color: var(--main-color) !important;
      color: var(--light-color) !important;
    }

    /* Desktop page header */
    .page-bar {
      position: sticky;
      top: 0;
      z-index: 150;
      background: #fdfcfb;
      border-bottom: 1px solid var(--line);
      padding-block: .8rem;
    }
    .page-bar__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* Override absolute positioning used inside the hero card */
    .page-bar .hero__logo,
    .page-bar .hero__burger {
      position: static !important;
      top: auto !important; left: auto !important; right: auto !important;
      opacity: 1 !important;
      transform: none !important;
    }
    /* Remove pill background from logo in page header */
    .page-bar .hero__logo {
      background: none;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      border: none;
    }
    @media (max-width: 900px) {
      .page-bar { display: none; }
      /* Push content below the fixed mobile header */
      main { padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
    }
  </style>
</head>
<body>

      <button class="mobile-header__burger" data-nav-toggle aria-label="פתח תפריט" aria-expanded="false" aria-controls="sideNav">

          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>

      </button>
    </header>

    <!-- Desktop page header (hidden on mobile, mobile uses .mobile-header) -->
    <header class="page-bar">

    <!-- ===================== Apartments / inventory ===================== -->

  <!-- Side-nav toggle script (shared behaviour with the home page) -->
  <script>
    (function(){
      var toggles = document.querySelectorAll('[data-nav-toggle]');
      var sideNav = document.getElementById('sideNav');
      var closeBtn = document.getElementById('navClose');
      var backdrop = document.getElementById('navBackdrop');
      if (!toggles.length || !sideNav) return;

      var savedScrollY = 0;
      function setExpanded(v){ for (var i=0;i<toggles.length;i++) toggles[i].setAttribute('aria-expanded', v ? 'true' : 'false'); }
      function open(){
        if (document.body.classList.contains('nav-open')) return;
        savedScrollY = window.scrollY || window.pageYOffset || 0;
        document.body.classList.add('nav-open');
        document.body.style.top = '-' + savedScrollY + 'px';
        setExpanded(true);
        sideNav.setAttribute('aria-hidden','false');
        if (backdrop) backdrop.setAttribute('aria-hidden','false');
      }
      function close(){
        if (!document.body.classList.contains('nav-open')) return;
        document.body.classList.remove('nav-open');
        document.body.style.top = '';
        window.scrollTo(0, savedScrollY);
        setExpanded(false);
        sideNav.setAttribute('aria-hidden','true');
        if (backdrop) backdrop.setAttribute('aria-hidden','true');
      }
      function toggle(){
        if (document.body.classList.contains('nav-open')) close();
        else open();
      }
      for (var i=0;i<toggles.length;i++) toggles[i].addEventListener('click', toggle);
      if (closeBtn) closeBtn.addEventListener('click', close);
      if (backdrop) backdrop.addEventListener('click', close);
      sideNav.addEventListener('click', function(e){ if (e.target.closest('a')) close(); });
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
